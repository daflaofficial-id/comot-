name: Deploy Jekyll site and Update Reviews

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [update-review]   # dipanggil dari frontend saat review/rating berubah

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -------------------------------
  # Job 1: Update reviews.json
  # -------------------------------
  update-reviews:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'update-review'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}   # token dengan akses repo

      - name: Update reviews.json
        run: |
          echo '${{ github.event.client_payload.data }}' > data/reviews.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/reviews.json
          git commit -m "Update reviews.json via repository_dispatch" || echo "No changes"
          git push

  # -------------------------------
  # Job 2: Build Jekyll
  # -------------------------------
  build:
    runs-on: ubuntu-latest
    needs: update-reviews
    if: always()   # tetap jalan meski update-reviews di-skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # -------------------------------
  # Job 3: Deploy ke GitHub Pages
  # -------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
